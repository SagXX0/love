<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Click</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #050505;
            font-family: Arial, sans-serif;
        }

        button {
            width: 250px;
            height: 250px;

            border: none;
            border-radius: 50%;

            background: #7b2cff;
            color: white;

            font-size: 35px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 30px #7b2cff,
                0 0 80px #7b2cff;

            transition: 0.15s;
        }

        button:hover {
            transform: scale(1.08);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <button onclick="playMusic()">
        KLIKNIJ
    </button>

    <audio id="music">
        <source src="phonk.mp3" type="audio/mpeg">
    </audio>

    <script>
        function playMusic() {
            const music = document.getElementById("music");

            music.play();

            document.querySelector("button").style.display = "none";
        }
    </script>

</body>
</html>
